[package]
name = "lintquest_core"
description = "Common backend for lintquest"
version = "0.1.0"
edition = "2024"
license = "GPLv3"
homepage = "https://github.com/bf2799/lintquest"
repository = "https://github.com/bf2799/lintquest"
readme = "README.md"
categories = ["games"]
keywords = ["linting", "quest", "game", "vscode"]

[dependencies]

[dev-dependencies]
rustfmt = "0.10.0"

[lints.rust]
